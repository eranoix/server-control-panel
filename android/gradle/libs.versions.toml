[versions]
kotlin = "2.4.10"
agp = "9.3.0"
openapiGenerator = "7.25.0"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.7.3"
kotlinxCoroutines = "1.11.0"
composeBom = "2026.08.00"
androidxActivityCompose = "1.13.0"
androidxNavigationCompose = "2.10.0"
androidxLifecycleCompose = "2.11.0"
androidxCoreKtx = "1.19.0"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Confirmado no maven-metadata.xml de dl.google.com em 2026-09-05 (mesmo trem
# de release de androidx.test:core/runner acima).
androidxTestRules = "1.7.0"
androidxTestUiautomator = "2.4.0"
coil = "2.7.0"
# leitor de video/audio das mensagens do WhatsApp. 1.11.0 e a ultima
# estavel (verificado no maven-metadata.xml do dl.google.com em 2026-09-05) --
# media3-exoplayer, media3-ui e media3-datasource-okhttp compartilham essa
# mesma versao.
media3 = "1.11.0"
# io.github.rosemoe (LGPL-2.1-or-later) -- NAO usar o grupo antigo
# io.github.Rosemoe.sora-editor (congelado em 0.23.6, sem mais correcoes).
soraEditor = "0.24.4"
# Fixado em 1.23.8 (grupo io.gitlab.arturbosch.detekt) -- API estavel que
# BffOnlyNetworkClientRule usa (requiresTypeResolution/BindingContext). O
# grupo mais novo dev.detekt (2.x, K2) tem API diferente/instavel.
detekt = "1.23.8"
compileSdk = "37"
targetSdk = "36"
# Frota confirmada 100% Android 14+ (~20 aparelhos admin, pareados por QR) — sem
# ganho de compatibilidade em baixar o piso e custo real em mantê-lo baixo.
# Decisão travada, não rederivar.
minSdk = "34"
# NDK r27d — Zig and the pinned Ghostty commit live in
# android/terminal-engine/toolchain.properties (version catalogs cannot
# express a git sha or a non-Maven toolchain version).
ndk = "27.3.13750724"
# minSdk 34 ja tem o provider nativo de Credential Manager no framework —
# nao precisa de androidx.credentials:credentials-play-services-auth (esse
# artefato so importa para repor o provider em API < 28/34 via Play
# Services, que nao existe piso aqui).
androidxCredentials = "1.6.0"
# CameraX (nao ML Kit) para o scanner de QR do pareamento: decodifica com
# zxing-core puro-JVM em vez de com.google.mlkit:barcode-scanning para nao
# trazer Play Services como dependencia transitiva so para ler um QR code.
cameraX = "1.6.2"
zxingCore = "3.5.4"
# EncryptedSharedPreferences (Keystore AES256_GCM) para ServerConfigStore —
# mesmo mecanismo ja designado para o futuro TokenStore (03-07), pra o
# endereco do servidor nunca ser menos durável/protegido que as credenciais
# que serao enviadas pra ele.
securityCrypto = "1.1.0"
# androidx.work para o motor de transferencia (download/upload resumavel):
# execucao durável em background que sobrevive a morte de processo, com
# retry/cancel nativos -- unico mecanismo desse tipo no app ate aqui.
androidxWork = "2.11.2"
androidxGlance = "1.1.1"
# FCM data-message receipt. No `google-services` plugin is applied
# anywhere in this build (no `google-services.json` exists yet — see
# 06-04-SUMMARY.md's provisioning gap, mirroring the server's own unset
# `fcm_service_account` vault secret): the SDK compiles and the receiver
# class is fully wired, but `FirebaseMessaging.getInstance()` cannot obtain a
# default `FirebaseApp` until a human provisions the Firebase project and
# either adds `google-services.json` + the plugin, or the app is changed to
# call `FirebaseApp.initializeApp(context, FirebaseOptions...)` explicitly.
firebaseBom = "34.4.0"
# io.getstream:stream-webrtc-android — fork mantido do WebRTC oficial do
# Google (org.webrtc.*), publicado pela GetStream a partir do AOSP upstream
# em vez do artefato non-official do JitPack que a maioria dos tutoriais usa.
# 1.3.10 verificado em 2026-09-05 no Maven Central (repo1.maven.org): POM
# aponta group io.getstream, o AAR baixado e inspecionado (unzip -l +
# classes.jar via javap) contem as 429 classes esperadas sob org.webrtc/
# org.webrtc.audio/org.webrtc.voiceengine (PeerConnectionFactory,
# Camera2Capturer, DefaultVideoEncoderFactory/DecoderFactory etc.) e as .so
# nativas das 4 ABIs (arm64-v8a, armeabi-v7a, x86, x86_64). Só a variante
# `-ktx` (extensions Kotlin sobre a mesma factory) é consumida por este
# módulo; `-compose` é declarada para 11-03/11-04 (composables de tile/PiP)
# mas não referenciada em nenhum build.gradle.kts ainda.
streamWebrtc = "1.3.10"
# androidx.datastore:datastore-preferences para o tamanho de fonte do
# terminal: 1.2.1 verificado em 2026-09-05 como a ultima estavel no
# maven-metadata.xml de dl.google.com/dl/android/maven2 (1.3.0-alpha10 e a
# pre-release mais nova). Preferencia puramente local, sem chamada de rede.
datastore = "1.2.1"
# androidx.biometric para o bloqueio do app (PreferenciasDeSeguranca).
# 1.1.0 e a ultima estavel; as 1.2.0-alpha nao entram porque este e o
# caminho que decide se a pessoa entra na propria ferramenta de trabalho.
biometric = "1.1.0"

[libraries]
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Icones da gaveta de navegacao (VpsmIcons/AppDrawer). SOMENTE o conjunto
# "core" (~48 icones, 823 KB de aar) -- material-icons-extended pesa 35,7 MB.
# O release agora liga R8 (app/build.gradle.kts), que removeria os icones nao
# referenciados do conjunto estendido; ainda assim o "core" continua sendo a
# escolha certa, porque cada icone e um objeto com ImageVector construido em
# funcao de nivel superior -- o shrinker preserva o grafo inteiro de qualquer
# um que seja alcancado, e trocar por "extended" so acrescentaria 35 MB de
# risco para nao ganhar nada. Os glifos que o core nao tem sao desenhados em
# :design-system a partir dos mesmos path data oficiais do Material -- ver
# VpsmIcons.kt.
# Sem version.ref de proposito: a versao vem do compose-bom.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigationCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycleCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycleCompose" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycleCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
# GrantPermissionRule (11-05: LockScreenAnswerDeclineTest grants CAMERA/RECORD_AUDIO so
# VpsmConnection.onAnswer's real permission check passes deterministically on device).
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
# UiDevice.sleep()/wakeUp() -- the only way an app under test can simulate a real screen-off/on
# cycle (Intent.ACTION_SCREEN_OFF is a protected broadcast; sendBroadcast on it throws
# SecurityException). Used by 11-05's BackgroundedCallSurvivesTest.
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxTestUiautomator" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
# coil-video (nao coil-compose) -- so :data a usa, para o VideoFrameDecoder
# do ImageLoader autenticado (com.vpsmanager.data.media). Traz coil-base
# transitivamente, sem trazer Compose.
coil-video = { module = "io.coil-kt:coil-video", version.ref = "coil" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
# So :data referencia este modulo (constroi o okhttp3.Call.Factory do
# OkHttpDataSource ali dentro, atras de com.vpsmanager.data.media).
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
sora-editor-bom = { group = "io.github.rosemoe", name = "editor-bom", version.ref = "soraEditor" }
sora-editor = { group = "io.github.rosemoe", name = "editor" }
sora-editor-language-textmate = { group = "io.github.rosemoe", name = "language-textmate" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidxCredentials" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
# Glance: o widget da tela inicial. Compose para RemoteViews — sem ele, um
# widget e XML + RemoteViews a mao, que e outra linguagem de UI para
# manter em paralelo com o resto do app.
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "androidxGlance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "androidxGlance" }
# work-testing: WorkManagerTestInitHelper para Robolectric — sem executor real
# de background, um TransferViewModel/ShareDestinationViewModel construído em
# teste teria WorkManager.getInstance() lançando (não inicializado).
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidxWork" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
stream-webrtc-android = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }
stream-webrtc-android-ktx = { module = "io.getstream:stream-webrtc-android-ktx", version.ref = "streamWebrtc" }
# Declarada, não consumida por nenhum módulo ainda — reservada para
# 11-03/11-04 (tiles/PiP em Compose). Ver nota de verificação acima.
stream-webrtc-android-compose = { module = "io.getstream:stream-webrtc-android-compose", version.ref = "streamWebrtc" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.3.6" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
