  /jira/board:
    get:
      description: Uma chamada devolve o quadro inteiro. `connected:false` é resposta normal para quem ainda não ligou a conta — o aplicativo mostra o formulário de conexão, não um erro.
      operationId: getJiraBoard
      parameters:
        - description: Chave do projeto; vazio usa o projeto configurado
          explode: false
          in: query
          name: project
          schema:
            description: Chave do projeto; vazio usa o projeto configurado
            type: string
        - description: "Filtro rápido: all, mine, todo, inprogress, last7, reported, custom"
          explode: false
          in: query
          name: filter
          schema:
            default: all
            description: "Filtro rápido: all, mine, todo, inprogress, last7, reported, custom"
            type: string
        - description: JQL próprio — só vale com filter=custom
          explode: false
          in: query
          name: jql
          schema:
            description: JQL próprio — só vale com filter=custom
            type: string
        - description: Busca livre sobre o que o JQL trouxe
          explode: false
          in: query
          name: search
          schema:
            description: Busca livre sobre o que o JQL trouxe
            type: string
        - description: campo:direção — updated:desc, key:asc, name:asc, type:asc
          explode: false
          in: query
          name: sort
          schema:
            description: campo:direção — updated:desc, key:asc, name:asc, type:asc
            type: string
        - description: Esconde concluídas há mais de N dias; 0 mostra todas
          explode: false
          in: query
          name: hide_done_days
          schema:
            description: Esconde concluídas há mais de N dias; 0 mostra todas
            format: int64
            type: integer
        - description: Teto de issues buscadas
          explode: false
          in: query
          name: max
          schema:
            default: 100
            description: Teto de issues buscadas
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraBoardResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: "O quadro kanban: colunas, cartões, filtros e projetos"
      tags:
        - mobile
        - jira
