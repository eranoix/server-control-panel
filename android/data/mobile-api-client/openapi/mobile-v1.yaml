          readOnly: true
          type: string
        content:
          type: string
        language:
          description: Hint de linguagem derivado da extensão, para syntax highlighting
          type: string
        mtime:
          description: mtime do arquivo em disco (unix) — devolver em write.expected_mtime para detectar conflito
          format: int64
          type: integer
        size:
          format: int64
          type: integer
      required:
        - content
        - mtime
        - language
        - size
      type: object
    FileWriteRequest:
      additionalProperties: false
