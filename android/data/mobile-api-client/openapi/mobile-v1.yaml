      requestBody:
        content:
          multipart/form-data:
            encoding:
              caption:
                contentType: text/plain
              client_msg_id:
                contentType: text/plain
              file:
                contentType: application/octet-stream
              msg_type:
                contentType: text/plain
              quoted_id:
                contentType: text/plain
            schema:
              properties:
                caption:
                  description: Legenda opcional
                  type: string
                client_msg_id:
                  description: ID gerado pelo cliente; reenviar com o mesmo id não duplica o envio
                  type: string
                file:
                  description: Arquivo de mídia a enviar
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
                msg_type:
                  description: image|video|audio|document; inferido do mime/nome quando vazio
                  type: string
                quoted_id:
                  description: ID da mensagem citada, se houver
                  type: string
              required:
                - file
                - client_msg_id
              type: object
