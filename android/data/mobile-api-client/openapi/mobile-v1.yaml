          type: boolean
        is_link:
          type: boolean
        mode:
          type: string
        modified:
          format: int64
          type: integer
        name:
          type: string
        size:
          format: int64
          type: integer
        target:
          type: string
      required:
        - name
        - size
        - modified
        - is_dir
      type: object
    FileListResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
