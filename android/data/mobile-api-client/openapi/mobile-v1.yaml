      requestBody:
        content:
          multipart/form-data:
            encoding:
              caption:
                contentType: text/plain
              client_msg_id:
                contentType: text/plain
              file:
                contentType: application/octet-stream
              msg_type:
                contentType: text/plain
              quoted_id:
                contentType: text/plain
            schema:
              properties:
                caption:
                  description: Optional caption
                  type: string
                client_msg_id:
                  description: Client-generated ID; resending with the same id does not duplicate the send
                  type: string
                file:
                  description: Media file to send
                  format: binary
                  type: string
                  x-contentEncoding: binary
                  x-contentMediaType: application/octet-stream
                msg_type:
                  description: image|video|audio|document; inferred from the mime/name when empty
                  type: string
                quoted_id:
                  description: ID of the quoted message, if any
                  type: string
              required:
