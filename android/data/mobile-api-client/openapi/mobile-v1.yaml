components:
  schemas:
    AlertSummary:
      additionalProperties: false
      properties:
        current_value:
          format: double
          type: number
        fired_since:
          format: int64
          type: integer
        name:
          type: string
        severity:
          type: string
        state:
          type: string
        threshold:
          format: double
          type: number
        unit:
          type: string
      required:
        - name
        - severity
        - state
        - current_value
        - threshold
      type: object
    AppUpdateArtifact:
      additionalProperties: false
      properties:
        sha256:
          description: SHA-256 (lowercase hex) of the .hdiff file itself
          type: string
        size_bytes:
          format: int64
          type: integer
        url:
          description: Absolute path of the bytes route (accepts Range, resumable download)
          type: string
      required:
        - url
        - size_bytes
        - sha256
      type: object
    AppUpdateRelease:
      additionalProperties: false
      properties:
        sha256:
          description: SHA-256 (lowercase hex) of this version's signed APK
          type: string
        size_bytes:
          description: Size of the reconstructed signed APK, not of the downloaded artifact
          format: int64
          type: integer
        version_code:
          format: int64
          type: integer
        version_name:
          type: string
      required:
        - version_name
        - version_code
        - sha256
        - size_bytes
      type: object
    AppUpdateResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AppUpdateResponse.json
          format: uri
          readOnly: true
          type: string
        full:
          $ref: "#/components/schemas/AppUpdateArtifact"
          description: Full reconstruction (hpatchz with an empty base); always available
        latest:
          $ref: "#/components/schemas/AppUpdateRelease"
        patch:
          $ref: "#/components/schemas/AppUpdateArtifact"
          description: Incremental patch from base_sha256; ABSENT when there is no patch for that exact base
        patch_tool:
          description: Tool and options that produced the artifacts, for diagnosing incompatibilities
          type: string
        up_to_date:
          description: true when base_sha256 is already the newest version's APK
          type: boolean
      required:
        - latest
        - up_to_date
        - full
        - patch_tool
      type: object
    AssignSessionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AssignSessionRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Session name
          type: string
        target:
          description: Owner user, or '*' for everyone
          type: string
      required:
        - name
        - target
      type: object
    AssignTargetsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AssignTargetsResponse.json
          format: uri
          readOnly: true
          type: string
        targets:
          description: User names, plus "*" for everyone
          items:
            type: string
          nullable: true
          type: array
      required:
        - targets
      type: object
    BackupSessionSummary:
      additionalProperties: false
      properties:
        lines:
          format: int64
          type: integer
        name:
          type: string
        summary:
          type: string
      required:
        - name
        - summary
        - lines
      type: object
    BackupSummary:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        created:
          format: int64
          type: integer
        id:
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/BackupSessionSummary"
          nullable: true
          type: array
        source:
          type: string
      required:
        - id
        - created
        - bytes
        - sessions
      type: object
    CPUMetrics:
      additionalProperties: false
      properties:
        cores:
          format: int64
          type: integer
        iowait:
          format: double
          type: number
        load1:
          format: double
          type: number
        load15:
          format: double
          type: number
        load5:
          format: double
          type: number
        model:
          type: string
        steal:
          format: double
          type: number
        used_percent:
          format: double
          type: number
      required:
        - cores
        - used_percent
        - load1
        - load5
        - load15
        - steal
        - iowait
      type: object
    ChatSummary:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        is_group:
          type: boolean
        jid:
          type: string
        last_message_at:
          format: int64
          type: integer
        last_message_preview:
          type: string
        name:
          type: string
        unread:
