          readOnly: true
          type: string
        content:
          type: string
        expected_mtime:
          description: mtime lido antes da edição; 0 ou omitido = sem leitura prévia, grava incondicionalmente
          format: int64
          type: integer
        path:
          type: string
      required:
        - path
        - content
      type: object
    FileWriteResponse:
