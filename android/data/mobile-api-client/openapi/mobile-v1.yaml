components:
  schemas:
    AlertSummary:
      additionalProperties: false
      properties:
        current_value:
          format: double
          type: number
        fired_since:
          format: int64
          type: integer
        name:
          type: string
        severity:
          type: string
        state:
          type: string
        threshold:
          format: double
          type: number
        unit:
          type: string
      required:
        - name
        - severity
        - state
        - current_value
        - threshold
      type: object
    AppUpdateArtifact:
      additionalProperties: false
      properties:
        sha256:
          description: SHA-256 (hex minúsculo) do próprio arquivo .hdiff
          type: string
        size_bytes:
          format: int64
          type: integer
        url:
          description: Caminho absoluto da rota de bytes (aceita Range, download retomável)
          type: string
      required:
        - url
        - size_bytes
        - sha256
      type: object
    AppUpdateRelease:
      additionalProperties: false
      properties:
        sha256:
          description: SHA-256 (hex minúsculo) do APK assinado desta versão
          type: string
        size_bytes:
          description: Tamanho do APK assinado reconstruído, não do artefato baixado
          format: int64
          type: integer
        version_code:
          format: int64
          type: integer
        version_name:
          type: string
      required:
        - version_name
        - version_code
        - sha256
        - size_bytes
      type: object
    AppUpdateResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AppUpdateResponse.json
          format: uri
          readOnly: true
          type: string
        full:
          $ref: "#/components/schemas/AppUpdateArtifact"
          description: Reconstrução completa (hpatchz com base vazia); sempre disponível
        latest:
          $ref: "#/components/schemas/AppUpdateRelease"
        patch:
          $ref: "#/components/schemas/AppUpdateArtifact"
          description: Patch incremental a partir de base_sha256; AUSENTE quando não há patch para essa base exata
        patch_tool:
          description: Ferramenta e opções que geraram os artefatos, para diagnóstico de incompatibilidade
          type: string
        up_to_date:
          description: true quando base_sha256 já é o APK da versão mais nova
          type: boolean
      required:
        - latest
        - up_to_date
        - full
        - patch_tool
      type: object
    AssignSessionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AssignSessionRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Nome da sessão
          type: string
        target:
          description: Usuário dono, ou '*' para todos
          type: string
      required:
        - name
        - target
      type: object
    AssignTargetsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/AssignTargetsResponse.json
          format: uri
          readOnly: true
          type: string
        targets:
          description: Nomes de usuário, mais "*" para todos
          items:
            type: string
          nullable: true
          type: array
      required:
        - targets
      type: object
    BackupSessionSummary:
      additionalProperties: false
      properties:
        lines:
          format: int64
          type: integer
        name:
          type: string
        summary:
          type: string
      required:
        - name
        - summary
        - lines
      type: object
    BackupSummary:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        created:
          format: int64
          type: integer
        id:
          type: string
        sessions:
          items:
            $ref: "#/components/schemas/BackupSessionSummary"
          nullable: true
          type: array
        source:
          type: string
      required:
        - id
        - created
        - bytes
        - sessions
      type: object
    CPUMetrics:
      additionalProperties: false
      properties:
        cores:
          format: int64
          type: integer
        iowait:
          format: double
          type: number
        load1:
          format: double
          type: number
        load15:
          format: double
          type: number
        load5:
          format: double
          type: number
        model:
          type: string
        steal:
          format: double
          type: number
        used_percent:
          format: double
          type: number
      required:
        - cores
        - used_percent
        - load1
        - load5
        - load15
        - steal
        - iowait
      type: object
    ChatSummary:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        is_group:
          type: boolean
        jid:
          type: string
        last_message_at:
          format: int64
          type: integer
        last_message_preview:
          type: string
        name:
          type: string
        unread:
          format: int64
          type: integer
      required:
        - jid
        - name
        - is_group
        - unread
      type: object
    CreateBackupRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/CreateBackupRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Sessão a salvar; vazio = todas num pacote
          type: string
      type: object
    CreateBackupResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/CreateBackupResponse.json
          format: uri
          readOnly: true
          type: string
        count:
          format: int64
          type: integer
        created:
          format: int64
          type: integer
        id:
          type: string
      required:
        - id
        - created
        - count
      type: object
    DeleteBackupOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/DeleteBackupOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DeployStatusOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/DeployStatusOutputBody.json
          format: uri
          readOnly: true
          type: string
        error:
          type: string
        progress:
          format: int64
          type: integer
        status:
          type: string
        step:
          type: string
      required:
        - status
        - progress
      type: object
    DiskMetrics:
      additionalProperties: false
      properties:
        free:
          format: int64
          minimum: 0
          type: integer
        fstype:
          type: string
        mount:
          type: string
        total:
          format: int64
          minimum: 0
          type: integer
        total_text:
          type: string
        used:
          format: int64
          minimum: 0
          type: integer
        used_percent:
          format: double
          type: number
        used_text:
          type: string
      required:
        - mount
        - total
        - used
        - free
        - used_percent
        - total_text
        - used_text
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    FileConflictResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/FileConflictResponse.json
