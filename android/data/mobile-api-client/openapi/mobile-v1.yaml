info:
  title: server-control-panel mobile BFF
  version: 1.0.0
openapi: 3.0.3
paths:
  /actions/{action_id}:
    post:
      operationId: runAction
      parameters:
        - description: Id of an action registered in internal/mobilebff/sdui (e.g. scheduler.jobs.run_now)
          in: path
          name: action_id
