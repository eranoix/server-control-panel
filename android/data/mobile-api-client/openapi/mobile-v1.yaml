      type: object
    WSTicketResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/mobile/v1/schemas/WSTicketResponse.json
          format: uri
          readOnly: true
          type: string
        expires_in:
          format: int64
          type: integer
        ticket:
          type: string
      required:
        - ticket
        - expires_in
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "Access token emitido por POST /auth/login (ou renovado por POST /auth/refresh), enviado como `Authorization: Bearer <token>`. Quem valida é auth.Middleware, o mesmo de toda rota autenticada do painel."
      scheme: bearer
      type: http
info:
  title: vps-manager mobile BFF
  version: 1.0.0
openapi: 3.0.3
paths:
  /actions/{action_id}:
    post:
      operationId: runAction
      parameters:
        - description: "Id da ação registrada em internal/mobilebff/sdui (ex.: scheduler.jobs.run_now)"
          in: path
          name: action_id
          required: true
          schema:
            description: "Id da ação registrada em internal/mobilebff/sdui (ex.: scheduler.jobs.run_now)"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Executa uma ação SDUI registrada, com confirmação destrutiva reforçada pelo servidor
      tags:
        - mobile
        - sdui
  /alerts/rules:
    get:
      operationId: getAlertsRuleRows
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Linhas da tabela alerts.rules — somente admin
      tags:
        - mobile
        - sdui
        - alerts
  /app/update:
    get:
      operationId: getAppUpdate
      parameters:
        - description: SHA-256 (hex) do APK instalado no aparelho; omitir devolve só o caminho completo
          explode: false
          in: query
          name: base_sha256
          schema:
            description: SHA-256 (hex) do APK instalado no aparelho; omitir devolve só o caminho completo
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: "Manifesto de atualização do app: patch incremental para a base informada, ou reconstrução completa"
      tags:
        - mobile
  /app/update/artifact:
    get:
      operationId: downloadAppUpdateArtifact
      parameters:
        - description: Campo 'file' do artefato, exatamente como veio no manifesto
          explode: false
          in: query
          name: file
          required: true
          schema:
            description: Campo 'file' do artefato, exatamente como veio no manifesto
            type: string
      responses:
        "200":
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Baixa um artefato de atualização (.hdiff), com suporte a Range — download retomável
      tags:
        - mobile
  /auth/login:
    post:
      description: Sucesso devolve access_token + refresh_token. Quando o segundo fator está enrolado e totp_code não foi enviado, devolve {"totp_required":true} sem nenhum token.
      operationId: mobileLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileLoginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Login por senha + segundo fator (mesma política MFA do painel desktop)
      tags:
        - mobile
        - auth
  /auth/logout:
    post:
      description: "Revoga SOMENTE o jti do token usado nesta chamada (mesmo internal/sessions.Store do painel web). Idempotente: chamar de novo com um token já revogado ainda responde 200."
      operationId: mobileLogout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileLogoutOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearerAuth: []
      summary: Encerra a sessão do dispositivo chamador — nunca as demais sessões do usuário
      tags:
        - mobile
        - auth
  /auth/pair:
    post:
      description: Nunca devolve uma sessão. O reg_token só autoriza começar uma cerimônia de registro de passkey em /auth/passkey/register/begin, cujo sucesso ainda fica pendente de aprovação no painel.
      operationId: mobilePairConsume
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingConsumeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingConsumeOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Troca um ticket de pareamento por QR code por um reg_token de passkey
      tags:
        - mobile
        - auth
  /auth/passkey/login/begin:
    post:
      operationId: passkeyLoginBegin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyLoginBeginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Inicia um login sem senha (passkey discoverable)
      tags:
        - mobile
        - auth
  /auth/passkey/login/finish:
    post:
      description: Sucesso devolve access_token + refresh_token (mesma forma de /auth/login). 403 {"error":"pending_approval"} quando a credencial existe mas ainda não foi aprovada no painel.
      operationId: passkeyLoginFinish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginFinishInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyLoginFinishOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Conclui o login sem senha
      tags:
        - mobile
        - auth
  /auth/passkey/register/begin:
    post:
      operationId: passkeyRegisterBegin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterBeginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegisterBeginOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Inicia o registro de uma passkey
      tags:
        - mobile
        - auth
  /auth/passkey/register/finish:
    post:
      description: Sucesso aqui SEMPRE devolve {"status":"pending_approval"}. A credencial nasce inerte e só pode logar depois de aprovada a partir de uma sessão desktop já autenticada.
      operationId: passkeyRegisterFinish
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterFinishInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegisterFinishOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Conclui o registro de uma passkey — NUNCA autentica
      tags:
        - mobile
        - auth
  /auth/refresh:
    post:
      description: "Rotação obrigatória: o refresh_token enviado é invalidado por esta chamada, com sucesso ou sem. Reenviar um token já rotacionado, revogado ou nunca emitido falha da mesma forma (401)."
      operationId: mobileRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileRefreshOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Troca um refresh token mobile por um novo par access+refresh
      tags:
        - mobile
        - auth
