org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin JVM target: falha em vez de avisar em caso de descompasso — não
# relaxar para "warning".
kotlin.jvm.target.validation.mode=error

android.useAndroidX=true

# applicationId de :app — identidade de distribuição (Digital Asset Links,
# F-Droid, Developer Verification), independente do namespace Kotlin/R-class
# (com.vpsmanager.app, definido em app/build.gradle.kts). Fonte humana deste
# valor: docs/android-signing-keystore.md Seção 2 (decisão ainda não travada
# — ver nota no topo daquele documento). Este é o ÚNICO lugar do build onde o
# literal existe; app/build.gradle.kts lê esta propriedade, e a task
# verifyApplicationIdMatchesDocs (registrada ali, presa a preBuild) falha o
# build se este valor divergir do que está documentado na Seção 2 — ver
# docs/android-signing-keystore.md Seção 7.
vpsmanager.applicationId=tech.northwind.vpsm.app

# Servidor padrão embutido no build. Este app é feito para UM servidor
# self-hosted: semear a URL no primeiro boot evita digitar hostname no
# celular, que é justamente o atrito que o pareamento por QR existe para
# eliminar. Sem esta propriedade o valor sai vazio e o app cai na tela de
# pareamento — comportamento correto para quem compila para outro servidor.
#
# Não confunda com estar autenticado: ter endereço de servidor e ter sessão
# são estados diferentes (ver LaunchDecisions.decideLaunchDestination). Ter
# colapsado os dois num booleano foi o que deixou o fluxo de passkey
# inalcançável no APK 0.1.4 — ver docs/android-achados-emulador.md §2.
vpsmanager.defaultServerUrl=https://panel.northwind.example
