org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Fail on a Kotlin/Java JVM target mismatch; do not relax to "warning".
kotlin.jvm.target.validation.mode=error

android.useAndroidX=true

# applicationId of :app: the distribution identity, independent of the Kotlin
# namespace. This is the only place the literal lives; verifyApplicationIdMatchesDocs
# fails the build if it diverges from docs/android-signing-keystore.md section 2.
servercontrolpanel.applicationId=tech.northwind.servercontrolpanel

# Default server baked into the build and seeded on first launch. Empty means
# the app opens the server setup screen, which is what a build for strangers
# needs. Having a server URL is not the same as having a session (see
# LaunchDecisions.decideLaunchDestination).
servercontrolpanel.defaultServerUrl=
