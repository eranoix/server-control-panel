# Enables only this project's custom rule. The default detekt rule sets are
# active by default regardless of buildUponDefaultConfig, so they are switched
# off explicitly (e.g. FunctionNaming would flag PascalCase @Composable functions).
comments:
  active: false
complexity:
  active: false
coroutines:
  active: false
empty-blocks:
  active: false
exceptions:
  active: false
naming:
  active: false
performance:
  active: false
potential-bugs:
  active: false
style:
  active: false
# Do not list `formatting`: detekt-formatting is not on the classpath, and
# naming its key without the module fails config validation.

bff-lint:
  active: true
  BffOnlyNetworkClient:
    active: true
