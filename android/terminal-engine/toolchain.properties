# Single source of truth for the libghostty-vt Android build, read by both
# build-libghostty.sh and .github/workflows/vendor-watch.yml. The C ABI is
# explicitly unstable upstream, so this pin is load-bearing — see
# .planning/phases/04-terminal-engine-spike/04-PLAN.md, Task 3/4.

# Same commit arcboxlabs/expo-libghostty pins for its Android build
# (build-android-libs.yml default `ghostty_commit` input), verified reachable
# on ghostty-org/ghostty at commit-resolution time.
GHOSTTY_COMMIT=b0947378349eff70f7030dda0e6d022fae1e6fbd
GHOSTTY_REPO=https://github.com/ghostty-org/ghostty

# Read from this exact commit's own build.zig.zon (`minimum_zig_version`),
# not trusted from either the reference implementation or upstream HEAD:
# `curl -sL https://raw.githubusercontent.com/ghostty-org/ghostty/b0947378349eff70f7030dda0e6d022fae1e6fbd/build.zig.zon`
# -> `.minimum_zig_version = "0.15.2"`. This happens to match the reference's
# pin because its chosen commit is old enough that upstream HEAD's later bump
# to 0.16.0 (declared in current build.zig.zon, not this commit's) does not
# apply here.
ZIG_VERSION=0.15.2

# docs/android-toolchain.md — NDK r27d as installed on this host.
NDK_VERSION=27.3.13750724

ABIS=arm64-v8a,x86_64
