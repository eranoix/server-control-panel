# Pins for the libghostty-vt build, read by build-libghostty.sh and
# toolchain-env.sh. The C ABI is explicitly unstable upstream, so the Ghostty
# commit must match the headers committed under vendor/include.

# Same commit arcboxlabs/expo-libghostty pins for its Android build.
GHOSTTY_COMMIT=b0947378349eff70f7030dda0e6d022fae1e6fbd
GHOSTTY_REPO=https://github.com/ghostty-org/ghostty

# Taken from this exact commit's build.zig.zon (`minimum_zig_version`), not
# from upstream HEAD, which has since moved on.
ZIG_VERSION=0.15.2
# From https://ziglang.org/download/index.json, checked before extraction.
ZIG_SHA256_X86_64_LINUX=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
ZIG_SHA256_AARCH64_LINUX=958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f

# Must match `ndk` in gradle/libs.versions.toml (NDK r27d).
NDK_VERSION=27.3.13750724

ABIS=arm64-v8a,x86_64
