# Fonte única de verdade do vendoring do HDiffPatch, lida por
# vendor-hdiffpatch.sh. Espelha terminal-engine/toolchain.properties: um
# arquivo de propriedades porque o version catalog do Gradle não sabe
# expressar sha de commit nem toolchain que não é Maven.
#
# Só o LADO PATCHER entra no aparelho — o gerador (hdiffz) roda no servidor.
# Ver src/main/cpp/Android.mk para os interruptores desligados.

# HDiffPatch v5.1.3 (tag), licença MIT. Sha resolvido da tag no momento do
# vendoring; nunca uma branch — o formato do arquivo de diff e a lista de
# plugins de compressão mudam entre versões maiores.
HDIFFPATCH_COMMIT=3b9dca715ca492873bf2c49e22e5d5b7d2a78620
HDIFFPATCH_REPO=https://github.com/sisong/HDiffPatch
HDIFFPATCH_TAG=v5.1.3

# Repositórios irmãos que o Android.mk do upstream espera ao lado de
# HDiffPatch/ (README do upstream, seção "get code"). São forks do sisong,
# não os upstreams originais: ele aplica ajustes de build que o Android.mk
# assume (ex.: lzma/Asm/arm64/LzmaDecOpt.S referenciado por caminho relativo
# a partir de lzma/C).
LZMA_COMMIT=44809544b95bbf2dccec75d954657ff76fc349ff
LZMA_REPO=https://github.com/sisong/lzma

ZSTD_COMMIT=68c88c7c7ad22b5e6882a5296ef96d27dc8750c4
ZSTD_REPO=https://github.com/sisong/zstd

XXHASH_COMMIT=e626a72bc2321cd320e953a0ccf1584cad60f363
XXHASH_REPO=https://github.com/sisong/xxHash

LIBMD5_COMMIT=51edeb63ec3f456f4950922c5011c326a062fbce
LIBMD5_REPO=https://github.com/sisong/libmd5

# docs/android-toolchain.md — mesmo NDK de :terminal-engine.
NDK_VERSION=27.3.13750724

ABIS=arm64-v8a,x86_64
