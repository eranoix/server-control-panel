# Single source of truth for HDiffPatch vendoring, read by
# vendor-hdiffpatch.sh. A properties file because the Gradle version catalog
# cannot express commit shas or non-Maven toolchains.
#
# Only the PATCHER side ships on the device; the generator (hdiffz) runs on
# the server. See src/main/cpp/Android.mk for the disabled switches.

# HDiffPatch v5.1.3 (tag), MIT license. Pinned to the tag's sha, never a
# branch: the diff format and compression plugin list change across major versions.
HDIFFPATCH_COMMIT=3b9dca715ca492873bf2c49e22e5d5b7d2a78620
HDIFFPATCH_REPO=https://github.com/sisong/HDiffPatch
HDIFFPATCH_TAG=v5.1.3

# Sibling repositories the upstream Android.mk expects next to HDiffPatch/.
# They are sisong's forks, not the original upstreams, because Android.mk
# relies on their build tweaks (e.g. lzma/Asm/arm64/LzmaDecOpt.S relative to lzma/C).
LZMA_COMMIT=44809544b95bbf2dccec75d954657ff76fc349ff
LZMA_REPO=https://github.com/sisong/lzma

ZSTD_COMMIT=68c88c7c7ad22b5e6882a5296ef96d27dc8750c4
ZSTD_REPO=https://github.com/sisong/zstd

XXHASH_COMMIT=e626a72bc2321cd320e953a0ccf1584cad60f363
XXHASH_REPO=https://github.com/sisong/xxHash

LIBMD5_COMMIT=51edeb63ec3f456f4950922c5011c326a062fbce
LIBMD5_REPO=https://github.com/sisong/libmd5

# docs/android-toolchain.md: same NDK as :terminal-engine.
NDK_VERSION=27.3.13750724

ABIS=arm64-v8a,x86_64
