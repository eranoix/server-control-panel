name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        # Not `make build`: that target runs a Tailwind step needing an
        # unversioned toolchain binary, so it cannot work from a clean clone.
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: go vet ./...

      - name: Formatting
        # gofmt is not a style preference here: the published tree is produced
        # by a transformation pipeline, and substituting a shorter name into an
        # aligned comment column is exactly the kind of damage that shows up
        # nowhere except in a diff nobody reads.
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite:"; echo "$unformatted"; exit 1
          fi
          echo "clean"

      - name: Test
        # The browser-rendered front-end tests need playwright installed and are
        # excluded here rather than silently skipped.
        run: go test $(go list ./... | grep -v '/internal/webassets')

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Front-end pins that need no browser
        # The step above skips internal/webassets wholesale, because some of its
        # pins render a page. Most do not: they load the panel's own sources
        # into a sandbox and assert on what the functions return, which needs
        # nothing but node.
        #
        # Those ran nowhere — not here, not in the excluded package — and that
        # is exactly where four real breakages were sitting: a comparison whose
        # two sides had drifted into different languages, an anchor searching a
        # comment for words that no longer existed, a repair recorded backwards,
        # and a humaniser translated without its assertions. An untested test is
        # not coverage; it is a file that looks like coverage.
        #
        # The set is derived, not listed, so a new pin is covered the day it is
        # written: every scripts/test-*.mjs that neither uses playwright nor
        # spawns a browser itself.
        run: |
          set -uo pipefail
          falhou=0
          for h in scripts/test-*.mjs; do
            if grep -qE 'playwright|spawn\(' "$h"; then continue; fi
            if node "$h" > /tmp/pin.log 2>&1; then
              echo "  ok    $(basename "$h")"
            else
              echo "::error::$(basename "$h") failed"
              tail -30 /tmp/pin.log
              falhou=1
            fi
          done
          exit "$falhou"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credentials
        # A second line of defence. This repository is generated by a
        # sanitising pipeline that already refuses to publish on a match; this
        # catches anything added by hand afterwards.
        run: |
          set -euo pipefail
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-ant-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|AIza[A-Za-z0-9_-]{35}|xox[abprs]-[A-Za-z0-9-]{10,}'
          if grep -rInE "$pattern" --exclude-dir=.git . ; then
            echo "::error::credential-shaped string found"
            exit 1
          fi
          echo "clean"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t server-control-panel:ci .
      - name: Boot it and check health
        run: |
          docker run -d --name ci -p 8765:8765 -e DEMO_MODE=1 server-control-panel:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          docker logs ci; exit 1
