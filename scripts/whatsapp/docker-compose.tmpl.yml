# WAHA WhatsApp gateway — per-user template managed by panel-whatsapp@{{.User}}
#
# Rendered by internal/whatsapp/manager.go for each profile. WAHA Core hardcodes
# session=default, so we run N containers (one per profile) instead of one
# container with N sessions (a paid tier).
#
# Template substitutions (text/template):
#   .User → safe username (validated by scope.New)
#   .Port → port allocated by the Registry (3100-3199)
#
# Secrets come from the per-profile .env (generated by the Manager from the
# namespaced vault):
#   - WAHA_API_KEY       (32-byte hex; stored at "{{.User}}:waha_api_key")
#   - WAHA_HMAC_SECRET   (webhook signature; "{{.User}}:waha_hmac_secret")

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: panel-whatsapp-{{.User}}
    restart: unless-stopped
    # network_mode: host → the webhook reaches 127.0.0.1:8765 without a bridge.
    # Each container exposes its API on WHATSAPP_API_PORT in the 3100-3199 range.
    network_mode: host
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_API_PORT={{.Port}}
      - WAHA_API_HOSTNAME=127.0.0.1

      - WHATSAPP_DEFAULT_ENGINE=GOWS

      # Per-path webhook: the panel takes {{.User}} from the path and checks that
      # user's HMAC, so a leaked secret of A cannot forge events for B.
      - WHATSAPP_HOOK_URL=http://127.0.0.1:8765/api/whatsapp/webhook/{{.User}}
      - WHATSAPP_HOOK_EVENTS=session.status,message,message.any,message.ack,message.revoked
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_HMAC_SECRET}

      - WAHA_PRINT_QR=false
      - WAHA_LOG_LEVEL=info
      - WAHA_LOG_FORMAT=json

      - WHATSAPP_START_SESSION=default
      - WHATSAPP_RESTART_ALL_SESSIONS=true

      - WAHA_DASHBOARD_ENABLED=false
      - WAHA_SWAGGER_ENABLED=false
    volumes:
      - /var/lib/panel-whatsapp/{{.User}}/sessions:/app/.sessions
      - /var/lib/panel-whatsapp/{{.User}}/media:/app/.media
      - /var/lib/panel-whatsapp/{{.User}}/files:/app/.files
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --header=\"X-Api-Key: $${WHATSAPP_API_KEY}\" http://127.0.0.1:{{.Port}}/api/server/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
