# WAHA WhatsApp gateway — managed by vpsm-whatsapp.service
#
# Single-session deployment using the GOWS engine (Whatsmeow, Go) which is the
# most stable engine offered by WAHA (same lib used by the Matrix bridge in
# production for years).
#
# Binds 127.0.0.1:3000 — never exposed to the public network. vps-manager
# proxies the UI on its own HTTPS port.
#
# Secrets (.env) are generated by scripts/whatsapp/install.sh:
#   - WAHA_API_KEY      (32-byte random hex; required for every API call)
#   - WAHA_HMAC_SECRET  (used by WAHA to sign webhook payloads; vps-manager
#                       verifies them in internal/whatsapp/webhook.go)

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: vpsm-whatsapp
    restart: unless-stopped
    # network_mode: host lets the webhook reach vps-manager directly on
    # 127.0.0.1:8765 without docker bridge gymnastics. WAHA still binds
    # WHATSAPP_API_PORT to localhost only.
    network_mode: host
    environment:
      # Auth
      - WHATSAPP_API_KEY=${WAHA_API_KEY}
      - WHATSAPP_API_PORT=3000
      - WAHA_API_HOSTNAME=127.0.0.1

      # Engine — GOWS = Whatsmeow (Go); most stable for production.
      - WHATSAPP_DEFAULT_ENGINE=GOWS

      # Webhook back to vps-manager. WAHA signs the raw body with HMAC-SHA512
      # (algorithm not configurable per WAHA docs as of 2026.5) using
      # WHATSAPP_HOOK_HMAC_KEY as the secret; we verify in webhook.go.
      - WHATSAPP_HOOK_URL=http://127.0.0.1:8765/api/whatsapp/webhook
      - WHATSAPP_HOOK_EVENTS=session.status,message,message.any,message.ack,message.revoked
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_HMAC_SECRET}

      # Don't print QR to logs — we surface it in the UI.
      - WAHA_PRINT_QR=false
      - WAHA_LOG_LEVEL=info
      - WAHA_LOG_FORMAT=json

      # Auto-start the default session on container boot (no manual click).
      - WHATSAPP_START_SESSION=default
      - WHATSAPP_RESTART_ALL_SESSIONS=true

      # Disable the unsigned dashboard — vps-manager IS the UI.
      - WAHA_DASHBOARD_ENABLED=false
      - WAHA_SWAGGER_ENABLED=false
    volumes:
      - /var/lib/vpsm-whatsapp/sessions:/app/.sessions
      - /var/lib/vpsm-whatsapp/media:/app/.media
      - /var/lib/vpsm-whatsapp/files:/app/.files
    healthcheck:
      # WAHA's /api/server/version requires X-Api-Key — read it from the
      # container env so the healthcheck passes auth.
      test: ["CMD-SHELL", "wget -q -O- --header=\"X-Api-Key: $${WHATSAPP_API_KEY}\" http://127.0.0.1:3000/api/server/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
