groups:
  - name: vpsmanager
    interval: 30s
    rules:
      - alert: BinaryDown
        expr: up{job="vpsmanager"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "vps-manager binary down"
          description: "Instance {{ $labels.instance }} has been down for > 3 minutes."

      - alert: LoginFailuresHigh
        expr: sum(rate(vpsm_login_failures_total[5m])) > 0.0833
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Login failures elevated"
          description: "Rate > 5/min for 2m."

      - alert: SubsystemDown
        expr: vpsm_subsystem_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Subsystem {{ $labels.subsystem }} reporting down"
          description: "Subsystem reported down for > 5 minutes."

      - alert: WSCliff
        expr: |
          (vpsm_ws_connections_active - vpsm_ws_connections_active offset 30s)
          / (vpsm_ws_connections_active offset 30s + 1) < -0.5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "WebSocket connections cliff"
          description: "WS connections dropped > 50% in 30s."

  - name: host
    interval: 30s
    rules:
      - alert: HostCPUHigh
        # Excludes steal time: this is CPU really used by our tenant, so a
        # sustained value above 85% is genuine saturation, not hypervisor throttling.
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) - avg(rate(node_cpu_seconds_total{mode="steal"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 85% for 10min (excl. steal)"
          description: "Real CPU usage (excluding steal time): {{ $value | printf \"%.1f\" }}%."

      - alert: HostStealHigh
        # Sustained steal above 30% means the hypervisor is starving us.
        expr: 100 * avg(rate(node_cpu_seconds_total{mode="steal"}[10m])) > 30
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CPU steal > 30% for 30min"
          description: "The hypervisor is taking {{ $value | printf \"%.1f\" }}% of the contracted CPU. Possibly provider overcommit."

      - alert: HostMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Available memory < 10%"
          description: "Only {{ $value | printf \"%.1f\" }}% of RAM available."

      # Swap: HostMemoryLow and ContainerMemoryNearLimit cannot see a full swap
      # (RAM can be plentiful, and a container may sit well under its memory
      # limit while `--memory` without `--memory-swap` lets it fill swap of the
      # same size). cAdvisor reports the same swap limit (0) for "disabled" and
      # "unlimited", so these rules alert on the effect, not the configuration.
      - alert: HostSwapAlmostFull
        expr: |
          node_memory_SwapTotal_bytes > 0
          and
          (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Swap above 75% on {{ $labels.instance }}"
          description: "A full swap leaves no headroom for the next memory spike, even with RAM to spare. See ContainerSwapHeavy for WHO is in there."

      - alert: HostSwapParado
        # High swap WITH plenty of free RAM: leftovers of a past memory crisis.
        # The other swap alerts never fire for it (below 75%, and idle pages
        # are not read), yet interactive sessions stall for seconds when their
        # pages come back from disk. The slow 6h `for` matches a slow condition.
        expr: |
          node_memory_SwapTotal_bytes > 0
          and
          (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 25
          and
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 > 50
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "Idle swap on {{ $labels.instance }} with RAM to spare"
          description: "Pages parked in swap from an old memory crisis, with more than half the RAM free. They cost nothing until someone touches that process, then the session stalls while they come back from disk. To recover, check the RAM headroom and run swapoff/swapon to bring everything back to RAM (about 3 min)."

      - alert: HostSwapThrashing
        # pswpin counts PAGES read from swap; x4096 gives bytes/s. Sustained
        # swap reads are what actually degrade the machine; cold swap does not.
        expr: rate(node_vmstat_pswpin[5m]) * 4096 > 1048576
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Reading from swap at {{ $value | humanize1024 }}B/s on {{ $labels.instance }}"
          description: "Pages coming back from swap steadily for 10min: the machine is trading memory for disk."

      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk / above 85%"
          description: "Root filesystem usage: {{ $value | printf \"%.1f\" }}%."

      - alert: HostLoadHigh
        expr: node_load5 > 2 * count(count by (cpu)(node_cpu_seconds_total))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load5 > 2x CPU count"
          description: "Load avg (5min) = {{ $value | printf \"%.2f\" }} on a host with {{ with query \"count(count by (cpu)(node_cpu_seconds_total))\" }}{{ . | first | value }}{{ end }} cores."

  - name: containers
    interval: 30s
    rules:
      - alert: ContainerCPUHogging
        expr: |
          sum by (container_name)(
            rate(container_cpu_usage_seconds_total{container_id!=""}[5m])
            * on(container_id) group_left(container_name) container_info
          ) * 100 > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_name }} using > 200% CPU"
          description: "{{ $value | printf \"%.0f\" }}% CPU sustained for 10min: look for a loop or a config problem."

      - alert: ContainerMemoryNearLimit
        # Only fires for containers that have a memory limit.
        expr: |
          (container_memory_working_set_bytes{container_id!=""} / container_spec_memory_limit_bytes{container_id!=""}) * 100 > 90
          and container_spec_memory_limit_bytes{container_id!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container_id }} close to its memory limit"
          description: "{{ $value | printf \"%.1f\" }}% of the limit used."

      - alert: ContainerSwapHeavy
        # Answers "who filled the swap?". 512 MiB is high enough to ignore cold
        # page spill and low enough to catch the culprit early.
        expr: container_memory_swap{container_id!="", name!=""} > 536870912
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} has {{ $value | humanize1024 }}B in swap"
          description: "Container resident in swap. For a model/ML service, check whether it got `--memory` without `--memory-swap` (Docker then allows swap as large as the RAM)."
