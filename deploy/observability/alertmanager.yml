global:
  resolve_timeout: 5m

route:
  receiver: vps-manager
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical alerts in their own group: notify at once, repeat more often.
    - matchers:
        - severity = "critical"
      receiver: vps-manager
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: vps-manager
    webhook_configs:
      # Loopback only: /_internal/alert has no auth middleware; the handler
      # accepts only RemoteAddr 127.0.0.1 (isLoopback).
      - url: http://127.0.0.1:8765/_internal/alert
        send_resolved: true

inhibit_rules:
  # While BinaryDown fires it silences everything else, to avoid an alert storm
  # when the app is down and dependent metrics drop to zero.
  - source_matchers:
      - alertname = BinaryDown
    target_matchers:
      - alertname =~ .+
    equal:
      - instance
