services:
  prometheus:
    image: prom/prometheus:v3.0.1
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/lib/prometheus/data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules/vpsmanager.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.listen-address=127.0.0.1:9090
      - --web.external-url=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana-oss:13.0.1
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/lib/grafana/data:/var/lib/grafana
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - type: bind
        source: ${VPSM_DATA_DIR:-/opt/projetos/vpsmanager/data}/.grafana_admin_pw
        target: /secrets/admin_pw
        read_only: true
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # The login form stays available as an emergency fallback if SSO breaks.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /secrets/admin_pw
      GF_SERVER_ROOT_URL: "https://panel.northwind.example/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Lets the panel (same origin) embed Grafana in an iframe; otherwise
      # Grafana sends X-Frame-Options: DENY.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # SSO via auth proxy: Traefik forwards X-WEBAUTH-USER from the panel.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE"
      # Upstreams allowed to set the header (Traefik on the docker bridge).
      GF_AUTH_PROXY_WHITELIST: "127.0.0.1, 172.17.0.0/16, 172.18.0.0/16"
      GF_AUTH_PROXY_SYNC_TTL: "60"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_SECURITY_COOKIE_SECURE: "true"

  alertmanager:
    image: prom/alertmanager:v0.29.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/lib/alertmanager/data:/alertmanager
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
      - --web.external-url=http://127.0.0.1:9093

  # node_exporter: HOST metrics. The ro mounts of /proc, /sys and / are needed
  # to read the real host, not the container.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    network_mode: host
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # textfile collector: exports container_info{container_id, container_name},
      # regenerated by a systemd timer on the host.
      - /etc/node_exporter/textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=127.0.0.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+|run/user/.+)($$|/)
      - --collector.systemd
      - --collector.processes
      - --collector.textfile.directory=/textfile

  # cAdvisor: per-container metrics on 127.0.0.1:8082 (8080 often conflicts).
  # Privileged to read cgroups and the Docker socket.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    network_mode: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      # /var/lib/docker is NOT mounted: cAdvisor does not understand Docker 28's
      # overlayfs driver. Only per-container filesystem metrics are lost.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --listen_ip=127.0.0.1
      - --port=8082
      # --docker_only=false (default): read via cgroups, since the Docker API
      # cannot resolve layer IDs with the overlayfs driver.
      - --housekeeping_interval=15s
      - --disable_metrics=cpu_topology,resctrl,udp,advtcp,sched,hugetlb,memory_numa,tcp,process,disk,diskIO
