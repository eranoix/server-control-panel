<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Join the video call</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-family='sans-serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EVM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/tailwind.css">
<style>
  body {
    background: radial-gradient(ellipse at top, #0c1424 0%, #050811 100%);
    color: #e5e7eb;
    font-family: -apple-system, system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: linear-gradient(180deg, #0e1525 0%, #0a1322 100%);
    border: 1px solid #1f2a40; border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #4678f9, #a78bfa); display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 18px; }
  h1 { font-size: 22px; font-weight: 700; text-align: center; margin: 0 0 6px; color: #f8fafc; }
  .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .label { display:block; font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .input {
    width: 100%; box-sizing: border-box;
    background: #0c1424; border: 1px solid #1f2a40;
    border-radius: 10px; padding: 14px 16px;
    font-size: 16px; color: #e5e7eb;
    transition: border-color .2s;
  }
  .input:focus { outline: 0; border-color: #4678f9; box-shadow: 0 0 0 3px rgba(70,120,249,.18); }
  .pin-input { font-family: ui-monospace, monospace; font-size: 24px; font-weight: 600; letter-spacing: .15em; text-align: center; text-transform: uppercase; }
  .btn {
    width: 100%; box-sizing: border-box;
    background: linear-gradient(180deg, #10b981 0%, #059669 100%);
    color: #fff; border: 0; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(16,185,129,.35);
    transition: transform .15s ease, box-shadow .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(16,185,129,.45); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .err { color: #fca5a5; font-size: 13px; background: #422028; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display:none; }
  .err.show { display: block; }
  .foot { text-align: center; font-size: 11px; color: #6b7280; margin-top: 22px; line-height: 1.5; }
  .foot a { color: #94a3b8; text-decoration: none; }
  .foot a:hover { color: #cbd5e1; text-decoration: underline; }
  .spinner { display:inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">VM</div>
  <h1>Join call</h1>
  <p class="sub">Paste the PIN you were given to join as a guest.</p>

  <div id="err" class="err"></div>

  <form id="frm" autocomplete="off">
    <div class="field">
      <label class="label" for="pin">PIN code</label>
      <input id="pin" class="input pin-input" type="text" maxlength="8" placeholder="ABC12XYZ" required>
    </div>
    <div class="field">
      <label class="label" for="name">Your name</label>
      <input id="name" class="input" type="text" maxlength="60" placeholder="How you want to appear">
    </div>
    <button id="submit" class="btn" type="submit">
      <span id="btn-label">📹 Join now</span>
    </button>
  </form>

  <div class="foot">
    The PIN is generated by the room owner and is valid for a limited time.<br>
    <a href="/">Back to the main panel</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const err = $('err'), btn = $('submit'), label = $('btn-label');
  const showErr = (m) => { err.textContent = m; err.classList.add('show'); };
  const hideErr = () => err.classList.remove('show');

  // Pre-fill the PIN when it arrives in the URL (?pin=XXXX or #pin=XXXX)
  const urlPin = new URLSearchParams(location.search).get('pin') ||
                 (location.hash.match(/[#&]pin=([^&]+)/) || [])[1] || '';
  if (urlPin) $('pin').value = urlPin.toUpperCase();
  // A clear message when the user got sent back here by an expired token (4h+).
  // Clears sessionStorage so a reload does not re-enter with the stale token.
  if (new URLSearchParams(location.search).get('expired') === '1') {
    try {
      sessionStorage.removeItem('vpsm_vc_guest_token');
      sessionStorage.removeItem('vpsm_vc_guest_room_id');
      sessionStorage.removeItem('vpsm_vc_guest_room_name');
      sessionStorage.removeItem('vpsm_vc_guest_expires_at');
    } catch (_) {}
    showErr('Your session expired. Sign in with the PIN again.');
  }
  // Auto-uppercase + strip spaces in the PIN
  $('pin').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });

  // Remember the name used last time
  const lastName = localStorage.getItem('vpsm_vc_guest_name') || '';
  if (lastName) $('name').value = lastName;

  $('frm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideErr();
    const pin = $('pin').value.trim();
    const name = $('name').value.trim();
    if (!pin || pin.length < 4) { showErr('Invalid PIN — check with whoever sent it to you.'); return; }
    btn.disabled = true; label.innerHTML = '<span class="spinner"></span> Connecting…';
    try {
      const r = await fetch('/api/videocall/join-by-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin, display_name: name }),
      });
      if (r.status === 429) throw new Error('Too many attempts. Wait a minute.');
      if (r.status === 401) throw new Error('Invalid or expired PIN.');
      if (!r.ok) throw new Error('Error ' + r.status + ' from the server.');
      const data = await r.json();
      // Persist token + name
      sessionStorage.setItem('vpsm_vc_guest_token', data.token);
      sessionStorage.setItem('vpsm_vc_guest_room_id', data.room_id);
      sessionStorage.setItem('vpsm_vc_guest_room_name', data.room_name || '');
      sessionStorage.setItem('vpsm_vc_guest_expires_at', String(data.expires_at || 0));
      if (name) localStorage.setItem('vpsm_vc_guest_name', name);
      // Redirect to the hash the panel intercepts
      location.href = '/?vc_guest=1#videocall=guest';
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; label.textContent = '📹 Join now';
    }
  });
})();
</script>
</body>
</html>
